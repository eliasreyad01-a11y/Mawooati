name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android/iOS folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name mawoonati --org com.mawoonati --platforms android,ios .
          fi
          rm -f test/widget_test.dart
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          for perm in ('INTERNET', 'CAMERA'):
              tag = '<uses-permission android:name="android.permission.%s"/>' % perm
              if 'android.permission.%s' % perm not in s:
                  s = s.replace('<application', tag + '\n    <application', 1)
          if 'android.hardware.camera' not in s:
              s = s.replace('<application', '<uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="مؤونتي"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n 'uses-permission\|uses-feature\|android:label' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      # لا توقف البناء عند الفشل كي تظهر النتائج كاملة في السجل
      - name: Analyze
        run: flutter analyze
        continue-on-error: true
      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Use Google's Maven Central mirror (avoids GitHub 504 on large jars)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'EOF'
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2'
          def fix = { repo ->
            if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('repo.maven.apache.org')) {
              repo.setUrl(new URI(mirror))
            }
          }
          beforeSettings { s ->
            s.pluginManagement.repositories.all(fix)
            s.dependencyResolutionManagement.repositories.all(fix)
          }
          allprojects {
            buildscript.repositories.all(fix)
            repositories.all(fix)
          }
          EOF

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for i in 1 2 3; do
            flutter build apk --release \
              --dart-define=SUPABASE_URL=$SUPABASE_URL \
              --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY && break
            echo "Build attempt $i failed; retrying..."
            if [ "$i" = "1" ]; then
              # تحميل Gradle من مرآة بديلة إن فشل المصدر الرسمي
              sed -i 's#https\\://services.gradle.org/distributions/#https\\://mirrors.cloud.tencent.com/gradle/#' android/gradle/wrapper/gradle-wrapper.properties
            fi
            sleep 20
          done
          test -f build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mawoonati-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk mawoonati.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mawoonati.apk --title "مؤونتي - أحدث نسخة" --notes "أحدث APK" --latest
