name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android/iOS folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name mawoonati --org com.mawoonati --platforms android,ios .
          fi
          rm -f test/widget_test.dart
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.CAMERA"/>\n')
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', perms + '    <application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="مؤونتي"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      # لا توقف البناء عند الفشل كي تظهر النتائج كاملة في السجل
      - name: Analyze
        run: flutter analyze
        continue-on-error: true
      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for i in 1 2 3; do
            flutter build apk --release \
              --dart-define=SUPABASE_URL=$SUPABASE_URL \
              --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY && break
            echo "Build attempt $i failed; retrying..."
            if [ "$i" = "1" ]; then
              # تحميل Gradle من مرآة بديلة إن فشل المصدر الرسمي
              sed -i 's#https\\://services.gradle.org/distributions/#https\\://mirrors.cloud.tencent.com/gradle/#' android/gradle/wrapper/gradle-wrapper.properties
            fi
            sleep 20
          done
          test -f build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mawoonati-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk mawoonati.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mawoonati.apk --title "مؤونتي - أحدث نسخة" --notes "أحدث APK" --latest
