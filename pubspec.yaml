name: mawoonati
description: "مؤونتي AI – منزلك أذكى.. وحياتك أسهل"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.33.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # يُحدَّد الإصدار تلقائياً بما يتوافق مع flutter_localizations
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: 10.1.4
  mobile_scanner: 6.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
          weight: 400
        - asset: assets/fonts/Cairo.ttf
          weight: 600
        - asset: assets/fonts/Cairo.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/app_icon.png
  adaptive_icon_background: "#E8F5E3"
  adaptive_icon_foreground: assets/logo/app_icon_foreground.png
  remove_alpha_ios: true
